<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="320" fill="#ffffff"/>

  <!-- Raw data -->
  <rect x="20" y="110" width="160" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="100" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Raw data</text>
  <text x="100" y="163" text-anchor="middle" font-size="12" fill="#3730a3">movies_metadata.csv</text>
  <text x="100" y="181" text-anchor="middle" font-size="12" fill="#3730a3">keywords.csv</text>
  <text x="100" y="199" text-anchor="middle" font-size="12" fill="#3730a3">ratings.csv</text>

  <line x1="180" y1="160" x2="225" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cleaning -->
  <rect x="230" y="115" width="150" height="90" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="305" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#164e63">Clean + merge</text>
  <text x="305" y="168" text-anchor="middle" font-size="12" fill="#155e75">drop sparse cols,</text>
  <text x="305" y="186" text-anchor="middle" font-size="12" fill="#155e75">fix dates, join keywords</text>

  <line x1="380" y1="160" x2="425" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Keyword vectorization -->
  <rect x="430" y="115" width="170" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="515" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Keyword vectors</text>
  <text x="515" y="168" text-anchor="middle" font-size="12" fill="#166534">MultiLabelBinarizer:</text>
  <text x="515" y="186" text-anchor="middle" font-size="12" fill="#166534">movie × keyword matrix</text>

  <line x1="600" y1="160" x2="645" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User profile -->
  <rect x="650" y="115" width="170" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="735" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">User profile</text>
  <text x="735" y="163" text-anchor="middle" font-size="12" fill="#9a3412">rating-weighted sum of</text>
  <text x="735" y="181" text-anchor="middle" font-size="12" fill="#9a3412">rated movies' keyword vecs</text>

  <line x1="820" y1="160" x2="865" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recommendations -->
  <rect x="870" y="120" width="90" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="915" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">Cosine</text>
  <text x="915" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">similarity</text>
  <text x="915" y="184" text-anchor="middle" font-size="11" fill="#991b1b">→ top-N recs</text>

  <!-- Branch to clustering -->
  <line x1="515" y1="205" x2="515" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="250" width="230" height="60" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="515" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">Exploratory: KMeans + PCA</text>
  <text x="515" y="293" text-anchor="middle" font-size="11" fill="#6b21a8">visualize movie clusters by keyword similarity</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
